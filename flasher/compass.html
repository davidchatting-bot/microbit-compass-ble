<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>micro:bit Compasses</title>
<style>
  :root { --bg: #fff; --card: #f4f4f7; --fg: #1b1b1f; --muted: #6b6b76; --accent: #2a6df4; --needle: #e5484d; --err: #c62828; --ring: #d4d4db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --card: #222228; --fg: #ececf1; --muted: #9a9aa6; --accent: #6b9bff; --needle: #ff6b6b; --err: #ff6b6b; --ring: #3a3a43; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; max-width: 40rem; }
  a { color: var(--accent); }
  button { font: inherit; font-weight: 600; padding: .75rem 1.5rem; border: 0; border-radius: .5rem; background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--muted); padding: .25rem .5rem; font-weight: 500; }
  #status { margin-top: .75rem; min-height: 1.5em; color: var(--err); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: 1rem; margin-top: 1.5rem; }
  .card { background: var(--card); border-radius: .75rem; padding: 1rem; text-align: center; }
  .card header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .card h2 { font-size: .95rem; margin: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card svg { width: 100%; max-width: 12rem; margin: .75rem auto 0; display: block; }
  .card .needle { transition: transform .15s linear; }
  .card .bearing { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .state { color: var(--muted); font-size: .85rem; min-height: 1.3em; }
  .card.offline svg, .card.offline .bearing { opacity: .35; }
</style>
</head>
<body>
<main>
  <h1>micro:bit Compasses</h1>
  <p>Shows the live compass bearing of micro:bits running the <a href="./">Compass BLE</a> program. Click Add, pick a micro:bit from Chrome's list, and repeat for each board. Works in Chrome or Edge on desktop or Android.</p>
  <button id="add">Add micro:bit</button>
  <div id="status" role="status"></div>
  <div id="grid"></div>
</main>

<template id="card">
  <div class="card">
    <header><h2></h2><button class="secondary" title="Disconnect">✕</button></header>
    <svg viewBox="-100 -100 200 200" aria-hidden="true">
      <circle r="92" fill="none" stroke="var(--ring)" stroke-width="4"/>
      <g fill="var(--muted)" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="central">
        <text y="-72">N</text><text x="72">E</text><text y="72">S</text><text x="-72">W</text>
      </g>
      <g class="needle">
        <polygon points="0,-58 9,0 -9,0" fill="var(--needle)"/>
        <polygon points="0,58 9,0 -9,0" fill="var(--ring)"/>
        <circle r="5" fill="var(--fg)"/>
      </g>
    </svg>
    <div class="bearing">–</div>
    <div class="state"></div>
  </div>
</template>

<script>
const MAGNETOMETER_SERVICE = "e95df2d8-251d-470a-a062-fa1922dfa9a8";
const BEARING_CHARACTERISTIC = "e95d9715-251d-470a-a062-fa1922dfa9a8";

const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const cards = new Map(); // device.id -> card

function cardFor(device) {
  let card = cards.get(device.id);
  if (card) return card;
  card = document.getElementById("card").content.firstElementChild.cloneNode(true);
  card.querySelector("h2").textContent = device.name || "micro:bit";
  card.querySelector("header button").addEventListener("click", () => {
    device.removeEventListener("gattserverdisconnected", card.onDisconnect);
    if (device.gatt.connected) device.gatt.disconnect();
    device.forget?.();
    cards.delete(device.id);
    card.remove();
  });
  card.onDisconnect = () => {
    card.classList.add("offline");
    reconnect(device, card);
  };
  device.addEventListener("gattserverdisconnected", card.onDisconnect);
  cards.set(device.id, card);
  grid.append(card);
  return card;
}

function showBearing(card, degrees) {
  // Rotate the dial, not the needle, by the shortest path so 359 -> 0 doesn't spin all the way round.
  const prev = card.angle ?? degrees;
  const delta = ((degrees - (prev % 360) + 540) % 360) - 180;
  card.angle = prev + delta;
  card.querySelector(".needle").style.transform = `rotate(${card.angle}deg)`;
  card.querySelector(".bearing").textContent = `${degrees}°`;
}

async function connect(device) {
  const card = cardFor(device);
  const state = card.querySelector(".state");
  state.textContent = "Connecting…";
  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(MAGNETOMETER_SERVICE);
  const bearing = await service.getCharacteristic(BEARING_CHARACTERISTIC);
  bearing.addEventListener("characteristicvaluechanged", (e) => showBearing(card, e.target.value.getUint16(0, true)));
  showBearing(card, (await bearing.readValue()).getUint16(0, true));
  await bearing.startNotifications();
  card.classList.remove("offline");
  state.textContent = "Connected";
}

async function reconnect(device, card) {
  if (card.reconnecting) return;
  card.reconnecting = true;
  const state = card.querySelector(".state");
  for (let attempt = 0; cards.has(device.id) && !device.gatt.connected; attempt++) {
    state.textContent = "Reconnecting…";
    try {
      await connect(device);
    } catch {
      state.textContent = "Out of range: retrying";
      await new Promise((r) => setTimeout(r, Math.min(2000 * 2 ** attempt, 30000)));
    }
  }
  card.reconnecting = false;
}

document.getElementById("add").addEventListener("click", async () => {
  statusEl.textContent = "";
  let device;
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [MAGNETOMETER_SERVICE],
    });
  } catch (e) {
    if (e.name !== "NotFoundError") statusEl.textContent = e.message; // NotFoundError = picker cancelled
    return;
  }
  if (cards.has(device.id) && device.gatt.connected) return;
  try {
    await connect(device);
  } catch (e) {
    const card = cards.get(device.id);
    card.classList.add("offline");
    card.querySelector(".state").textContent =
      e.name === "NotFoundError" ? "No compass service: is it running Compass BLE?" : e.message;
  }
});

if (!navigator.bluetooth) {
  document.getElementById("add").disabled = true;
  statusEl.textContent = "This browser doesn't support Web Bluetooth. Use Chrome or Edge on desktop or Android.";
} else if (navigator.bluetooth.getDevices) {
  // Reconnect to boards this site was already given permission for.
  navigator.bluetooth.getDevices().then((devices) => {
    for (const device of devices) {
      cardFor(device).classList.add("offline");
      reconnect(device, cards.get(device.id));
    }
  });
}
</script>
</body>
</html>
