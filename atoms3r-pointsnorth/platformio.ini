[env:atoms3r]
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
lib_deps =
  m5stack/M5Unified
  h2zero/NimBLE-Arduino@^1.4.3
monitor_speed = 115200
; One link per other device: the prebuilt controller has room for 4 alongside advertising and scanning.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
