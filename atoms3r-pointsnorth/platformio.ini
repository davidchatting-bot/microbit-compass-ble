[env:atoms3r]
platform = espressif32@6.10.0
board = m5stack-atoms3
framework = arduino
lib_deps =
  m5stack/M5Unified
  h2zero/NimBLE-Arduino@^1.4.3
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.4.2
  tzapu/WiFiManager@^2.0.17
monitor_speed = 115200
; NimBLE only scans (for the session), so it needs no links of its own beyond reading one Session characteristic.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; Another relay, e.g. server/ from this repo on your laptop:
;  '-DPN_SERVER_HOST="192.168.1.20"' -DPN_SERVER_PORT=3000 '-DPN_SERVER_PATH="/pubgames"' -DPN_SERVER_SSL=false
